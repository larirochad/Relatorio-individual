<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Botão Flutuante</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .tabela-teste {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn-mostrar-todos {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 22px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            margin-top: 15px;
            transition: all 0.3s ease;
            font-family: 'Saira', sans-serif;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(102,51,153,0.07);
        }
        .btn-mostrar-todos:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #e9ecef;
            padding: 12px;
            text-align: center;
        }
        th {
            background: #f8f9fa;
            font-weight: bold;
        }
        .linha-extra {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Teste do Botão Flutuante</h1>
    
    <div class="tabela-teste">
        <h2>Tabela de Teste</h2>
        <table id="tabela_teste">
            <thead>
                <tr>
                    <th>Linha</th>
                    <th>Dado 1</th>
                    <th>Dado 2</th>
                    <th>Dado 3</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Valor 1</td>
                    <td>Valor 2</td>
                    <td>Valor 3</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Valor 4</td>
                    <td>Valor 5</td>
                    <td>Valor 6</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Valor 7</td>
                    <td>Valor 8</td>
                    <td>Valor 9</td>
                </tr>
                <tr class="linha-extra" data-tabela="tabela_teste" style="display:none;">
                    <td>4</td>
                    <td>Valor 10</td>
                    <td>Valor 11</td>
                    <td>Valor 12</td>
                </tr>
                <tr class="linha-extra" data-tabela="tabela_teste" style="display:none;">
                    <td>5</td>
                    <td>Valor 13</td>
                    <td>Valor 14</td>
                    <td>Valor 15</td>
                </tr>
                <tr class="linha-extra" data-tabela="tabela_teste" style="display:none;">
                    <td>6</td>
                    <td>Valor 16</td>
                    <td>Valor 17</td>
                    <td>Valor 18</td>
                </tr>
            </tbody>
        </table>
        <div style="text-align: center;">
            <button class="btn-mostrar-todos" data-tabela="tabela_teste" data-mostrando="false">Ver todos os dados</button>
        </div>
    </div>

    <button id="fabMinimizar" class="btn-mostrar-todos" style="display:none; position: fixed; bottom: 40px; right: 40px; z-index: 9999; background: linear-gradient(135deg, #dc3545 0%, #c82333 100%); color: white; border: none; border-radius: 12px; padding: 12px 24px; cursor: pointer; font-size: 1em; font-weight: 600; font-family: 'Saira', sans-serif; box-shadow: 0 4px 16px rgba(220,53,69,0.3); transition: all 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 6px 20px rgba(220,53,69,0.4)'" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 16px rgba(220,53,69,0.3)'">Mostrar menos</button>

    <script>
    // Funções globais para o botão flutuante
    let tabelaExpandida = null;
    const fabMinimizar = document.getElementById('fabMinimizar');

    function mostrarFabMinimizar(tabelaId) {
        console.log('mostrarFabMinimizar chamada com:', tabelaId);
        tabelaExpandida = tabelaId;
        if (fabMinimizar) {
            fabMinimizar.style.display = 'block';
            console.log('Botão flutuante mostrado');
        } else {
            console.log('fabMinimizar não encontrado');
        }
    }

    function esconderFabMinimizar() {
        console.log('esconderFabMinimizar chamada');
        tabelaExpandida = null;
        if (fabMinimizar) {
            fabMinimizar.style.display = 'none';
            console.log('Botão flutuante escondido');
        } else {
            console.log('fabMinimizar não encontrado');
        }
    }

    // Ao clicar no botão flutuante, minimiza a tabela expandida
    if (fabMinimizar) {
        fabMinimizar.onclick = function() {
            console.log('Botão flutuante clicado, tabelaExpandida:', tabelaExpandida);
            if (!tabelaExpandida) {
                console.log('Nenhuma tabela expandida');
                return;
            }
            // Procura o botão de "Ver todos os dados" correspondente e clica nele para minimizar
            const btn = document.querySelector(`[data-tabela="${tabelaExpandida}"]`);
            console.log('Botão encontrado:', btn);
            if (btn) {
                btn.click();
                console.log('Botão clicado');
            }
            esconderFabMinimizar();
            // Scroll para o topo da tabela minimizada
            const tabela = document.getElementById(tabelaExpandida);
            if (tabela) {
                const y = tabela.getBoundingClientRect().top + window.scrollY - 80;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        };
    } else {
        console.log('fabMinimizar não encontrado no onclick');
    }

    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('btn-mostrar-todos')) {
            console.log('Botão btn-mostrar-todos clicado');
            const tabelaId = e.target.getAttribute('data-tabela');
            const extras = document.querySelectorAll('.linha-extra[data-tabela="' + tabelaId + '"]');
            const mostrando = e.target.getAttribute('data-mostrando') === 'true';
            
            console.log('tabelaId:', tabelaId);
            console.log('extras encontrados:', extras.length);
            console.log('mostrando:', mostrando);
            
            extras.forEach(linha => {
                linha.style.display = mostrando ? 'none' : '';
            });
            
            e.target.innerText = mostrando ? 'Ver todos os dados' : 'Mostrar menos';
            e.target.setAttribute('data-mostrando', mostrando ? 'false' : 'true');
            
            // Lógica para mostrar/esconder o botão flutuante
            if (mostrando) {
                // Se está minimizando, esconde o botão flutuante
                console.log('Minimizando tabela');
                esconderFabMinimizar();
            } else {
                // Se está expandindo, mostra o botão flutuante
                console.log('Expandindo tabela');
                mostrarFabMinimizar(tabelaId);
            }
        }
    });
    </script>
</body>
</html>
